# Carta Digital — 3 ambientes (Desarrollo / QA / Producción).
# Desarrollo y QA son aislados: cada uno con su propia app, su propio
# Postgres (vacío, autoinicializado desde db/init.sql), su propia red y sus
# propios volúmenes — no comparten nada entre sí.
# Producción es distinta a propósito: usa el PostgreSQL NATIVO del servidor
# (los datos reales), no un Postgres de Docker — ver el comentario en
# app-prod más abajo.
#
# Uso (un ambiente a la vez: el servidor real tiene poca RAM):
#   docker compose up -d --build app-dev db-dev
#   docker compose up -d --build app-qa db-qa
#   docker compose up -d --build app-prod
#
# Cada ambiente necesita su archivo de variables (.env.dev / .env.qa / .env.prod),
# copiado desde .env.docker.example. Nunca se versionan (ver .gitignore).

services:
  # ---------------------------------------------------------------- DESARROLLO
  db-dev:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.dev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [red_dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-dev:
    build: .
    restart: unless-stopped
    env_file: .env.dev
    environment:
      NODE_ENV: development
      PGHOST: db-dev
      PGPORT: 5432
    ports:
      - "3001:3000"
    volumes:
      - imagenes_dev:/app/dist/public/imagenes
    networks: [red_dev]
    depends_on:
      db-dev:
        condition: service_healthy

  # ---------------------------------------------------------------- QA
  db-qa:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.qa
    volumes:
      - pgdata_qa:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [red_qa]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-qa:
    build: .
    restart: unless-stopped
    env_file: .env.qa
    environment:
      NODE_ENV: production
      PGHOST: db-qa
      PGPORT: 5432
    ports:
      - "3002:3000"
    volumes:
      - imagenes_qa:/app/dist/public/imagenes
    networks: [red_qa]
    depends_on:
      db-qa:
        condition: service_healthy

  # ---------------------------------------------------------------- PRODUCCIÓN
  # Producción NO tiene su propio Postgres en Docker: se conecta directo al
  # PostgreSQL NATIVO del servidor (el mismo que ya tiene los datos reales
  # — restaurantes, cartas, items, usuarios). Por eso usa network_mode:host
  # (así "127.0.0.1" dentro del contenedor es el propio host, sin tener que
  # abrir el Postgres nativo a la red de Docker) y PGHOST=127.0.0.1 va en
  # .env.prod. El PORT real de escucha también se define en .env.prod
  # (3003), ya que con network_mode:host no se usa "ports:".
  app-prod:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
    network_mode: host
    volumes:
      - imagenes_prod:/app/dist/public/imagenes

networks:
  red_dev:
  red_qa:

volumes:
  pgdata_dev:
  pgdata_qa:
  imagenes_dev:
  imagenes_qa:
  imagenes_prod:
